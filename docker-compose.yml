version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sisvigia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  api-sisgbm:
    build:
      context: .
      target: development
    depends_on:
      db:
        condition: service_healthy
    command: yarn start:dev
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
volumes:
  pgdata:
  node_modules: